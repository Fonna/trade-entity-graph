[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-entity-graph"
version = "0.1.0"
description = "Company relationship graph MVP for trade order evidence, review, and visualization."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Trade Entity Graph Team" }]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "streamlit>=1.34",
  "pandas>=2.2",
  "polars>=0.20",
  "openpyxl>=3.1",
  "networkx>=3.3",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trade_entity_graph.importers" = ["field_mappings/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
